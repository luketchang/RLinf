model_type: "gr00t_n1d7"

# Model precision and loading settings
precision: "bf16"
trust_remote_code: True
is_lora: false

# NVIDIA's SO-100/SO-101 N1.7 data config uses five arm joints, one gripper
# joint, and a 16-action prediction horizon.
action_dim: 6
num_action_chunks: 16
denoising_steps: 4

obs_converter_type: "so101"
embodiment_tag: "so101"
add_value_head: True

rl_head_config:
  joint_logprob: False
  noise_method: "flow_sde"
  ignore_last: False
  safe_get_logprob: False
  noise_anneal: False
  noise_params: [0.7, 0.3, 400]
  noise_level: 0.5
  # Flow-SDE explores in normalized model space. The generic post-decode noise
  # path clamps to [-1, 1], which is invalid for absolute LeRobot motor values.
  action_noise_scale: 0.0
  add_value_head: ${..add_value_head}
  chunk_critic_input: False
  detach_critic_input: True
  disable_dropout: True
  use_vlm_value: False
  value_vlm_mode: "mean_token"
  padding_value: 570

num_steps: 4
