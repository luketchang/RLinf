# Train the SO-101 Pi0.5 CFG policy from RECAP advantage labels.
# Dataset/model paths and run length are supplied by the operator launcher.

defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: so101-recap
    experiment_name: "so101-cfg-policy"
    logger_backends: ["tensorboard"]
  max_epochs: 30000
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000

data:
  num_workers: 8
  advantage_tag: so101_recap
  balance_dataset_weights: true
  seed: 42
  train_data_paths:
    - dataset_path: "/path/to/so101_sft_dataset"
      type: "sft"
      weight: 1.0
    - dataset_path: "/path/to/so101_rollout_dataset"
      type: "rollout"
      weight: 1.0

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 64
  seed: 0
  model:
    precision: null
    model_path: "/path/to/pi05_so101_checkpoint"
    model_type: "cfg_model"
    num_action_chunks: 50
    action_dim: 6
    add_value_head: false
    openpi:
      config_name: "pi05_so101_vials"
      model_action_dim: 32
      cfgrl_guidance_scale: 1.0
      unconditional_prob: 0.1
      train_expert_only: true
      guidance_type: "positive"
      positive_only_conditional: true
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: "cosine"
    lr_warmup_steps: 5000
    total_training_steps: 30000
    min_lr: 0.0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: false
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false
critic:
  use_critic_model: false
