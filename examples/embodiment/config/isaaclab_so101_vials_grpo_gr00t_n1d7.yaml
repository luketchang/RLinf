# Critic-free GRPO for the native GR00T N1.7 SO-101 policy.
defaults:
  - env/isaaclab_so101_vials@env.train
  - env/isaaclab_so101_vials@env.eval
  - model/gr00t_n1d7_so101@actor.model
  - model/gr00t_n1d7_so101@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run: {dir: .}
  output_subdir: null
  searchpath: ["file://${oc.env:EMBODIED_PATH}/config/"]

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: so101-groot-n17-rlft
    experiment_name: so101_vials_grpo_gr00t_n1d7
    logger_backends: [tensorboard]
  max_epochs: 32
  max_steps: -1
  only_eval: false
  val_check_interval: 4
  save_interval: 4
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  # low_var_kl estimates KL(current || frozen SFT reference) with lower
  # variance than the raw log-ratio estimator.
  kl_penalty: low_var_kl
  group_size: 8
  reward_coef: 1.0
  rollout_epoch: 4
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 1.0e-4
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  # With binary task reward, group means in [0.01, 0.99] select only groups
  # containing both successes and failures. Uniform groups carry no GRPO
  # comparison signal and are excluded from AdamW.
  filter_rewards: true
  rewards_lower_bound: 0.01
  rewards_upper_bound: 0.99

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 4
    total_num_envs: 16
    group_size: 8
    max_episode_steps: 1344
    max_steps_per_rollout_epoch: 1344
    auto_reset: false
    ignore_terminations: false
    fixed_reset_seed: false
    seed: 42
    # GRPO uses the native, confirmed-placement task reward. Shaping is off so
    # reward filtering and group-relative comparisons retain binary semantics.
    reward_shaping:
      enabled: false
  eval:
    rollout_epoch: 1
    total_num_envs: 8
    group_size: 1
    max_episode_steps: 1344
    max_steps_per_rollout_epoch: 1344
    auto_reset: false
    ignore_terminations: true
    fixed_reset_seed: true
    seed: 31000
    reward_shaping:
      enabled: false
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:SO101_GROOT_N17_RLINF_MODEL}
    backbone_model_path: ${oc.env:SO101_GROOT_N17_BACKBONE}
    add_value_head: false
    num_action_chunks: 16
    denoising_steps: 4
    rl_head_config:
      add_value_head: false
      noise_method: flow_sde
      noise_level: 0.5

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # 16 envs * 4 rollouts * (1344 / 16 chunks) = 5376 samples. One global
  # batch gives one AdamW update per collection while retaining all samples.
  global_batch_size: 5376
  micro_batch_size: 2
  seed: 42
  enable_offload: true
  combine_reference_model: true
  reference_micro_batch_size: 4
  model:
    model_path: ${oc.env:SO101_GROOT_N17_RLINF_MODEL}
    backbone_model_path: ${oc.env:SO101_GROOT_N17_BACKBONE}
    add_value_head: false
    num_action_chunks: 16
    denoising_steps: 4
    rl_head_config:
      add_value_head: false
      noise_method: flow_sde
      noise_level: 0.5
  optim:
    lr: 1.0e-6
    value_lr: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: true
    use_orig_params: true
    # Keep live training checkpoints as resumable DCP shards.  Gathering a
    # full 3B state dict duplicates the actor while reference, rollout, and
    # Isaac workers are resident; export portable weights offline instead.
    save_full_model_weights: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward: {use_reward_model: false}
critic: {use_critic_model: false}
