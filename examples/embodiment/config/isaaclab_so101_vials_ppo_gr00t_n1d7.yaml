# Paper-style PPO/GAE training for native GR00T N1.7 on SO-101 vials.
# GR00T's model preset freezes Qwen language/vision and trains its complete
# action expert (DiT plus action-side projections/attention) and value head.
defaults:
  - env/isaaclab_so101_vials@env.train
  - env/isaaclab_so101_vials@env.eval
  - model/gr00t_n1d7_so101@actor.model
  - model/gr00t_n1d7_so101@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run: {dir: .}
  output_subdir: null
  searchpath: ["file://${oc.env:EMBODIED_PATH}/config/"]

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: so101-groot-n17-rlft
    experiment_name: so101_vials_ppo_gr00t_n1d7
    logger_backends: [tensorboard]
  max_epochs: 32
  max_steps: -1
  only_eval: false
  val_check_interval: 4
  save_interval: 4
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  # Matches RLInf's GR00T PPO references. kl_beta=0 intentionally means no
  # frozen-SFT reference-policy penalty; PPO ratio clipping is the constraint.
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 4
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false

env:
  group_name: EnvGroup
  train:
    # 16 vectorized scenes x 4 sequential rollout epochs = 64 trajectories.
    rollout_epoch: 4
    total_num_envs: 16
    group_size: 1
    max_episode_steps: 1344
    max_steps_per_rollout_epoch: 1344
    auto_reset: false
    ignore_terminations: false
    fixed_reset_seed: false
    seed: 42
    reward_shaping:
      enabled: false
  eval:
    rollout_epoch: 1
    total_num_envs: 8
    group_size: 1
    max_episode_steps: 1344
    max_steps_per_rollout_epoch: 1344
    auto_reset: false
    ignore_terminations: true
    fixed_reset_seed: true
    seed: 31000
    reward_shaping:
      enabled: false
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:SO101_GROOT_N17_RLINF_MODEL}
    backbone_model_path: ${oc.env:SO101_GROOT_N17_BACKBONE}
    add_value_head: true
    num_action_chunks: 16
    denoising_steps: 4
    rl_head_config:
      add_value_head: true
      noise_method: flow_sde
      noise_level: 0.5

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # 16 envs x 4 rollouts x (1344 / 16 action chunks) = 5376 samples/update.
  global_batch_size: 5376
  micro_batch_size: 2
  seed: 42
  enable_offload: true
  model:
    model_path: ${oc.env:SO101_GROOT_N17_RLINF_MODEL}
    backbone_model_path: ${oc.env:SO101_GROOT_N17_BACKBONE}
    add_value_head: true
    num_action_chunks: 16
    denoising_steps: 4
    rl_head_config:
      add_value_head: true
      noise_method: flow_sde
      noise_level: 0.5
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: true
    use_orig_params: true
    save_full_model_weights: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward: {use_reward_model: false}
critic: {use_critic_model: false}
