# Frozen GR00T N1.7 evaluation through RLInf's native Actor/Rollout/Env path.
defaults:
  - env/isaaclab_so101_vials@env.train
  - env/isaaclab_so101_vials@env.eval
  - model/gr00t_n1d7_so101@actor.model
  # `only_eval` makes RLInf construct the rollout model directly, so compose
  # the full native GR00T model schema here as well.  Keeping this as a Hydra
  # default prevents the actor and rollout paths from drifting.
  - model/gr00t_n1d7_so101@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run: {dir: .}
  output_subdir: null
  searchpath: ["file://${oc.env:EMBODIED_PATH}/config/"]

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: so101-groot-n17-eval
    experiment_name: so101_vials_eval_gr00t_n1d7
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 1
  eval:
    rollout_epoch: 4
    total_num_envs: 8
    max_episode_steps: 1344
    max_steps_per_rollout_epoch: 1344
    auto_reset: false
    ignore_terminations: true
    fixed_reset_seed: true
    seed: 31000
    fixed_reset_seed_schedule: [31000, 31008, 31016, 31024]
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
      fps: 5
      frame_stride: 6
      async_encode: true
      encoder_workers: 1
      max_pending_videos: 2
      encoder_preset: ultrafast
      encoder_crf: 28

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:SO101_GROOT_N17_RLINF_MODEL}
    backbone_model_path: ${oc.env:SO101_GROOT_N17_BACKBONE}
    add_value_head: false
    num_action_chunks: 16
    denoising_steps: 4

actor:
  group_name: ActorGroup
  training_backend: fsdp
  global_batch_size: 8
  micro_batch_size: 1
  seed: 42
  enable_offload: true
  model:
    model_path: ${oc.env:SO101_GROOT_N17_RLINF_MODEL}
    backbone_model_path: ${oc.env:SO101_GROOT_N17_BACKBONE}
    add_value_head: false
    num_action_chunks: 16
    denoising_steps: 4
  optim:
    lr: 0.0
    value_lr: 0.0
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    use_orig_params: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward: {use_reward_model: false}
critic: {use_critic_model: false}
